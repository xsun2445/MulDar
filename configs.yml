description: multi-radar distributed imaging, table test
num_trigger:    200   # frames
period_frame:   10   # ms
radar_timeout:  5     # s
saving_root_dir: ./adcData/
flag_visualize: True
flag_save: False
wait_for_threads: False

chirp_cfg:
  num_frame:  1
  num_chirp:  1
  num_config: 6
  num_adc:    256
  num_ch:     4

activated_radar:
  - idx: 0
    name: middle
    mono_chirp_idx: [0,1]
    client_name: slave_5
    pose: [0.7285, 0.3531, 135.3847]  # x, y, yaw (only considering 2D pose)
    cmap: Reds
    alpha: 0.5
    # # optional to switch to recorded data for visualization
    # from_record_file: ./adcData/eval_data/inthewild/table_video/20251205_034038/radar_0.bin
    
  - idx: 1
    name: left
    mono_chirp_idx: [2,3]
    client_name: slave_6
    pose: [0.0, 0.0, 90]
    cmap: Greens
    alpha: 0.5
    # from_record_file: ./adcData/eval_data/inthewild/table_video/20251205_034038/radar_1.bin
    
  - idx: 2
    name: right
    mono_chirp_idx: [4,5]
    client_name: slave_4
    pose: [-0.6939, 0.2795, 44.5802]
    cmap: Blues
    alpha: 0.5
    # from_record_file: ./adcData/eval_data/inthewild/table_video/20251205_034038/radar_2.bin 
    

visual_cfg:
  nfft_range: 512
  nfft_angle: 63
  max_range: 4.0 # m
  
ramp_cfg:
  Fs: 2150000.0
  adc_start_time: 7.0e-06
  f0: 77010000000.0
  idel_time: 50.0
  num_adc: 256
  ramp_time: 0.0001285
  slope: 38816929000000.0
  tx_start_time: 0.0

